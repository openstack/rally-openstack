- job:
    name: rally-task-neutron-taas
    parent: rally-task-at-devstack
    required-projects:
      - name: openstack/tap-as-a-service
    vars:
      rally_task: rally-jobs/taas.yaml
      devstack_localrc:
        TAAS_SERVICE_DRIVER: TAAS:TAAS:neutron_taas.services.taas.service_drivers.ovn.taas_ovn.TaasOvnDriver:default
      devstack_plugins:
        rally-openstack: https://opendev.org/openstack/rally-openstack
        tap-as-a-service: https://opendev.org/openstack/tap-as-a-service
      devstack_services:
        taas: true
        tap_mirror: true
        ceilometer-acentral: false
        ceilometer-acompute: false
        ceilometer-alarm-evaluator: false
        ceilometer-alarm-notifier: false
        ceilometer-anotification: false
        ceilometer-api: false
        ceilometer-collector: false
        horizon: false
        tempest: false
