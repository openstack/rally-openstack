- job:
    name: rally-task-magnum
    parent: rally-task-at-devstack
    required-projects:
      - name: openstack/devstack
      - name: openstack/rally
      - name: openstack/rally-openstack
      - name: openstack/magnum
      - name: openstack/magnum-capi-helm
      - name: openstack/python-magnumclient
    vars:
      devstack_plugins:
        rally-openstack: https://opendev.org/openstack/rally-openstack
        magnum: https://opendev.org/openstack/magnum
        magnum-capi-helm: https://opendev.org/openstack/magnum-capi-helm
      devstack_services:
        magnum: true
        # disable redundant services for the job
        horizon: false
        tempest: false
      rally_task: rally-jobs/magnum.yaml
