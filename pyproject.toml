[build-system]
requires = [
    "pbr>=6.1.1"
]
build-backend = "pbr.build"

[project]
name = "rally-openstack"
description = "Rally plugins for OpenStack platform"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { text = "Apache License, Version 2.0" }
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version", "dependencies"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://docs.openstack.org/rally/latest/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["rally_openstack*"]
exclude = ["tests"]

[project.entry-points."rally_plugins"]
path = "rally_openstack"
options = "rally_openstack.common.cfg.opts:list_opts"

[project.entry-points."oslo.config.opts"]
rally_openstack = "rally_openstack.common.cfg.opts:list_opts"

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["tools"]

[tool.ruff.lint]
# Hacking (H...) and the Rally-specific N3xx checks stay in flake8;
# ruff owns everything else.
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort: import grouping and ordering
    "C4",      # flake8-comprehensions
    "Q",       # flake8-quotes
    "A",       # flake8-builtins
    "N",       # pep8-naming
    "TID",     # flake8-tidy-imports (banned-api)
    "PGH003",  # `type: ignore` must name the specific error code
    "PGH004",  # `noqa` must name the specific rule code
    "PLC0414", # band redundant aliases
    "ICN",     # flake8-import-conventions
    "UP",      # pyupgrade
]
ignore = [
    "E731", # do not assign a lambda expression, use a def
    "C402", # allow dict(<generator>) instead of forcing a dict comprehension
    "C408", # allow dict(a=1) / list() constructor calls (e.g. ansible arg specs)
    "UP031", # keep %-style string formatting
]

[tool.ruff.lint.isort]
known-first-party = ["rally_openstack", "tests"]
force-single-line = true
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "rally",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
rally = ["rally"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.flake8-import-conventions.aliases]
datetime = "dt"
typing = "t"
typing_extensions = "te"
"rally.common.logging" = "logging"

[tool.ruff.lint.flake8-import-conventions]
# Builtins are imported as modules: forbid `from <stdlib> import ...` so the
# standard library is imported whole (e.g. `import os`, then `os.path`).
# `__future__` and `unittest` (`from unittest import mock`) stay allowed, as
# does `importlib` (`from importlib.metadata import version`).
banned-from = [
    "abc", "argparse", "ast", "asyncio", "base64", "bisect", "builtins",
    "calendar", "cmath", "codecs", "collections", "configparser",
    "contextlib", "copy", "csv", "ctypes", "dataclasses", "datetime",
    "decimal", "difflib", "dis", "email", "enum", "errno", "functools", "gc",
    "getpass", "gettext", "glob", "gzip", "hashlib", "heapq", "hmac", "html",
    "http", "inspect", "io", "ipaddress", "itertools", "json", "logging",
    "math", "mimetypes", "multiprocessing", "numbers", "operator", "os",
    "pathlib", "pickle", "platform", "pprint", "queue", "random", "re",
    "secrets", "select", "shlex", "shutil", "signal", "socket", "sqlite3",
    "ssl", "stat", "string", "struct", "subprocess", "sys", "tempfile",
    "textwrap", "threading", "time", "token", "tokenize", "traceback",
    "types", "typing", "typing_extensions", "unicodedata", "urllib", "uuid",
    "warnings", "weakref", "xml", "zipfile", "zlib",
]

[tool.ruff.lint.per-file-ignores]
# ansible role dirs are hyphenated by convention -> not valid module names;
# an inline noqa is impossible (the package __init__.py files are empty).
"tests/ci/playbooks/**" = ["N999"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use `rally.common.logging` instead of the stdlib logging."
"oslo_log".msg = "Use `rally.common.logging` instead of oslo_log."
"oslo.utils".msg = "The oslo.* namespace is deprecated, use oslo_utils."

[tool.mypy]
files = [
    "rally_openstack",
]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
allow_redefinition = true
strict_equality = true
# disable warnings on missing `return None` at the end of functions that
#   declare optional result
no_warn_no_return = true


# Disable type failures for tests
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "barbicanclient.*",
    "cinderclient.*",
    "designateclient.*",
    "glanceclient.*",
    "gnocchiclient.*",
    "heatclient.*",
    "ironicclient.*",
    "keystoneauth1.*",
    "keystoneclient.*",
    "kubernetes.*",
    "magnumclient.*",
    "manilaclient.*",
    "mistralclient.*",
    "monascaclient.*",
    "novaclient.*",
    "neutronclient.*",
    "octaviaclient.*",
    "osc_lib.*",
    "osprofiler.*",
    "swiftclient.*",
    "troveclient.*",
    "watcherclient.*",
    "zaqarclient.*"

]
ignore_missing_imports = true

