- name: Create keystone projects & users for a new rally environment
  become: true
  become_user: stack
  command: >-
    {{ rally_python }}
    {{ rally_openstack_src_dir }}/tests/ci/make_env_spec_with_existing_users.py
    --projects-count {{ projects_count }}
    --users-per-project {{ users_per_project }}
    --parent-env-name devstack
    --path-for-new-spec {{ existing_users_env_spec }}

- name: Create a new Rally environment
  become: true
  become_user: stack
  shell: rally env create --name devstask-with-users --spec "{{ existing_users_env_spec }}"

- name: Print new Rally env spec
  become: true
  become_user: stack
  command: "rally env show --only-spec"
