- name: Check OpenStack resources after Rally launch
  become: true
  become_user: stack
  command: >-
    {{ rally_python }} {{ rally_openstack_src_dir }}/tests/ci/osresources.py
    compare {{ resources_at_start_dest }}
    --output {{ resources_diff_dest }}
    {{ '--no-fail' if rally_ignore_leaked_resources | bool else '' }}
  register: command_result
  failed_when: false

- name: Update status.txt
  become: true
  become_user: stack
  shell: echo "{{ cleanup_error_msg }}" > "{{ rally_results_dir }}/status.txt"
  when: command_result.rc != 0

- name: Fail if there are some resources left after Rally execution
  fail:
    msg: "{{ cleanup_error_msg }}"
  when: command_result.rc != 0
