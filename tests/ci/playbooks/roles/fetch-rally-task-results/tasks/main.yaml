- name: Change the status message
  become: true
  vars:
    os_rally_src: "{{ zuul.projects['opendev.org/openstack/rally-openstack'].src_dir }}"
  shell:
    cmd: |
      set -e
      if [ -f "{{ rally_results_dir }}/status.txt" ]; then
        MSG=`cat {{ rally_results_dir }}/status.txt`
      else
        MSG="Unexpected error had happened before Rally Task start. Check ARA for more details."
      fi

      if [ "$MSG" != "OK" ]; then
        sed -i -- "s/var errorMessage = null\;/var errorMessage = \'$MSG\';/g" {{ os_rally_src }}/tests/ci/pages/task-index.html
      fi

- name: Check the existence of results dir
  stat:
    path: '{{ rally_results_dir }}'
  register: results_dir_stat

- name: Copy Rally results
  become: true
  synchronize:
    src: '{{ rally_results_dir }}'
    dest: '{{ zuul.executor.log_root }}'
    mode: pull
    copy_links: true
    verify_host: true
    rsync_opts:
      - --include=/**
      - --include=*/
      - --exclude=*
      - --prune-empty-dirs
  when: results_dir_stat.stat.exists

- name: Put index.html in the right place
  become: true
  synchronize:
    src: "{{ zuul.projects['opendev.org/openstack/rally-openstack'].src_dir }}/tests/ci/pages/task-index.html"
    dest: '{{ zuul.executor.log_root }}/index.html'
    mode: pull
    copy_links: true
    verify_host: true
    rsync_opts:
      - --include=/**
      - --include=*/
      - --exclude=*
      - --prune-empty-dirs

- name: List Rally results
  become: true
  find:
    paths: '{{ rally_results_dir }}'
  register: rally_results_files
  when: results_dir_stat.stat.exists

- name: Return artifacts to Zuul
  vars:
    rally_index_artifact:
      - name: "Rally CI report"
        url: "index.html"
    rally_report_artifacts:
      - name: "HTML report"
        url: "results/report.html"
      - name: "Trends report"
        url: "results/trends.html"
      - name: "Success criteria (SLA)"
        url: "results/sla.txt"
      - name: "Text report"
        url: "results/detailed.txt"
      - name: "Text report (with iterations data)"
        url: "results/detailed_with_iterations.txt"
      - name: "JSON report"
        url: "results/report.json"
      - name: "JUnit XML report"
        url: "results/junit.xml"
      - name: "Task file"
        url: "results/task.yaml"
    rally_existing_results: >-
      {{ rally_results_files.files | default([])
         | map(attribute='path') | map('basename')
         | map('regex_replace', '^', 'results/') | list }}
  zuul_return:
    data:
      zuul:
        artifacts: >-
          {{ rally_index_artifact
             + (rally_report_artifacts
                | selectattr('url', 'in', rally_existing_results) | list) }}
